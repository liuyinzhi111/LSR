<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失色纪·修钟人 — 游戏介绍</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0C0916;
  --gold: #C4A35A;
  --text: #E8DFD0;
  --muted: rgba(232,223,208,0.5);
  --border: rgba(196,163,90,0.2);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'ZCOOL XiaoWei', 'STKaiti', serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* ── 顶部导航 ── */
.top-bar {
  flex-shrink: 0;
  background: rgba(12,9,22,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 0;
  z-index: 10;
}

.back-link {
  color: var(--gold);
  text-decoration: none;
  font-size: 10pt;
  padding: 12px 16px 12px 0;
  border-right: 1px solid var(--border);
  margin-right: 4px;
  flex-shrink: 0;
  transition: opacity 0.2s;
}

.back-link:hover { opacity: 0.7; }

.tab-nav {
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 12pt;
  padding: 12px 20px;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color 0.2s;
}

.tab-btn:hover { color: var(--text); }

.tab-btn.active { color: var(--gold); }

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 16px;
  right: 16px;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

/* ── 内容区 ── */
.content-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.tab-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: none;
  background: #fff;
}

.tab-frame.active {
  display: block;
}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">← 返回主页</a>
  <div class="tab-nav">
    <button class="tab-btn active" data-tab="0">游戏概览</button>
    <button class="tab-btn" data-tab="1">完整解说</button>
    <button class="tab-btn" data-tab="2">快速介绍</button>
  </div>
</div>

<div class="content-area">
  <iframe class="tab-frame active" src="game-intro.html"></iframe>
  <iframe class="tab-frame" src="game-playthrough.html"></iframe>
  <iframe class="tab-frame" src="game-presentation.html"></iframe>
</div>

<script>
(function() {
  const btns = document.querySelectorAll('.tab-btn');
  const frames = document.querySelectorAll('.tab-frame');

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.tab);
      btns.forEach(b => b.classList.remove('active'));
      frames.forEach(f => f.classList.remove('active'));
      btn.classList.add('active');
      frames[idx].classList.add('active');
    });
  });
})();
</script>
</body>
</html>
