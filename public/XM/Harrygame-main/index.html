<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>失色纪·修钟人</title>
    <link rel="preconnect" href="https://fonts.loli.net">
    <link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #0A0814;
        --gold: #C4A35A;
        --red: #C2452D;
        --text: #E8DFD0;
        --muted: rgba(232,223,208,0.45);
        --parchment: #F0E6C8;
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
        font-family: 'ZCOOL XiaoWei', 'STKaiti', serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* ── 粒子背景 ── */
    canvas#particles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    /* ── 暗角光晕 ── */
    .vignette {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(10,8,20,0.85) 100%);
        pointer-events: none;
        z-index: 1;
    }

    /* ── 主内容 ── */
    .landing {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 40px 24px;
        max-width: 560px;
    }

    /* ── 装饰线 ── */
    .ornament {
        color: var(--gold);
        font-size: 14px;
        letter-spacing: 0.6em;
        opacity: 0.4;
        margin-bottom: 24px;
    }

    /* ── 标题 ── */
    .title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: clamp(48px, 10vw, 72px);
        color: var(--parchment);
        line-height: 1.1;
        text-shadow: 0 0 60px rgba(196,163,90,0.2), 0 2px 8px rgba(0,0,0,0.5);
        margin-bottom: 4px;
    }

    .subtitle {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: clamp(18px, 4vw, 26px);
        color: var(--gold);
        letter-spacing: 0.2em;
        margin-bottom: 8px;
    }

    .en-title {
        font-family: 'Cinzel Decorative', serif;
        font-size: clamp(10px, 2vw, 13px);
        color: var(--muted);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        margin-bottom: 20px;
    }

    .tagline {
        font-size: clamp(13px, 2.5vw, 15px);
        color: var(--muted);
        line-height: 1.8;
        margin-bottom: 48px;
    }

    /* ── SVG 线稿 ── */
    .figure-wrap {
        width: 140px;
        margin: 0 auto 28px;
        opacity: 0.5;
        color: var(--gold);
    }

    .figure-wrap svg { width: 100%; height: auto; }

    /* ── 按钮组 ── */
    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
    }

    .btn {
        display: block;
        width: 240px;
        padding: 14px 0;
        border: 1px solid rgba(196,163,90,0.35);
        border-radius: 4px;
        background: rgba(196,163,90,0.06);
        color: var(--parchment);
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 18px;
        letter-spacing: 0.15em;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }

    .btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, transparent 40%, rgba(196,163,90,0.08) 100%);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .btn:hover {
        border-color: var(--gold);
        background: rgba(196,163,90,0.12);
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(196,163,90,0.15);
    }

    .btn:hover::before { opacity: 1; }

    .btn-play {
        background: rgba(194,69,45,0.12);
        border-color: rgba(194,69,45,0.4);
    }

    .btn-play:hover {
        border-color: var(--red);
        background: rgba(194,69,45,0.2);
        box-shadow: 0 6px 24px rgba(194,69,45,0.2);
    }

    /* ── 底部信息 ── */
    .credits {
        margin-top: 48px;
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.1em;
        opacity: 0.6;
    }

    /* ── 入场动画 ── */
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .landing > * {
        animation: fadeUp 0.8s ease both;
    }
    .ornament     { animation-delay: 0.1s; }
    .figure-wrap  { animation-delay: 0.2s; }
    .title        { animation-delay: 0.3s; }
    .subtitle     { animation-delay: 0.4s; }
    .en-title     { animation-delay: 0.5s; }
    .tagline      { animation-delay: 0.6s; }
    .btn-group    { animation-delay: 0.8s; }
    .credits      { animation-delay: 1.0s; }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="vignette"></div>

    <div class="landing">
        <div class="ornament">❧ &nbsp; ✦ &nbsp; ❧</div>

        <div class="figure-wrap">
            <svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                <g opacity="0.45">
                    <path d="M100,58 Q108,52 118,54 Q124,55 126,60"/>
                    <path d="M102,56 Q112,48 120,50"/>
                    <ellipse cx="96" cy="60" rx="8" ry="7"/>
                    <path d="M92,59 Q94,57 96,59"/>
                    <path d="M88,64 Q80,62 72,66 Q62,70 54,68"/>
                    <path d="M78,64 Q76,72 72,76"/>
                    <path d="M54,68 Q48,70 42,68"/>
                    <path d="M56,70 Q50,74 44,72"/>
                    <path d="M62,70 Q58,76 52,78"/>
                </g>
                <g opacity="0.7">
                    <circle cx="80" cy="48" r="6"/>
                    <path d="M74,46 Q76,40 80,39 Q84,40 86,46"/>
                    <path d="M80,54 Q82,60 84,64"/>
                    <path d="M80,56 Q86,58 90,60"/>
                    <path d="M80,58 Q84,62 88,64"/>
                    <path d="M84,64 Q82,72 78,76"/>
                    <path d="M84,64 Q88,72 86,76"/>
                    <circle cx="78" cy="52" r="0.8" fill="currentColor" stroke="none"/>
                    <circle cx="77" cy="55" r="0.6" fill="currentColor" stroke="none" opacity="0.5"/>
                </g>
            </svg>
        </div>

        <div class="title">失色纪</div>
        <div class="subtitle">修钟人</div>
        <div class="en-title">Shiseji · The Clockmender</div>
        <div class="tagline">当颜色被吞噬，用最后一滴颜料，绘出归途</div>

        <div class="btn-group">
            <a href="game.html" class="btn btn-play">开始游戏</a>
            <a href="intro.html" class="btn btn-intro">游戏介绍</a>
        </div>

        <div class="credits">手绘水彩 × 暗黑童话 &nbsp;·&nbsp; Vanilla JS &nbsp;·&nbsp; 2026</div>
    </div>

    <script>
    (function() {
        const c = document.getElementById('particles');
        const ctx = c.getContext('2d');
        let W, H, dots = [];

        function resize() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
        }

        function init() {
            resize();
            dots = [];
            for (let i = 0; i < 60; i++) {
                dots.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.5 + 0.5,
                    dx: (Math.random() - 0.5) * 0.3,
                    dy: -Math.random() * 0.3 - 0.1,
                    a: Math.random() * 0.5 + 0.1,
                    hue: Math.random() > 0.7 ? '196,163,90' : '194,69,45'
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            for (const d of dots) {
                d.x += d.dx;
                d.y += d.dy;
                d.a += (Math.random() - 0.5) * 0.01;
                d.a = Math.max(0.05, Math.min(0.6, d.a));
                if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
                if (d.x < -10) d.x = W + 10;
                if (d.x > W + 10) d.x = -10;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${d.hue},${d.a})`;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        init();
        draw();
    })();
    </script>
</body>
</html>
